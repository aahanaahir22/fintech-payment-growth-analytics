<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#f8fafc"/>
<rect x="50" y="45" width="1300" height="95" rx="18" fill="#111827"/>
<text x="85" y="92" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Fintech Payment Reliability &amp; Growth Analytics</text>
<text x="85" y="122" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="17">Synthetic portfolio case study · 4,000 payment attempts · 6 markets</text>
<g font-family="Arial, Helvetica, sans-serif">
  <g transform="translate(50 175)"><rect width="300" height="135" rx="16" fill="#ffffff" stroke="#d1d5db"/><text x="25" y="40" fill="#4b5563" font-size="17" font-weight="700">PAYMENT SUCCESS RATE</text><text x="25" y="95" fill="#111827" font-size="42" font-weight="700">88.42%</text></g>
  <g transform="translate(385 175)"><rect width="300" height="135" rx="16" fill="#ffffff" stroke="#d1d5db"/><text x="25" y="40" fill="#4b5563" font-size="17" font-weight="700">FAILED GMV</text><text x="25" y="95" fill="#111827" font-size="42" font-weight="700">$33.0K</text></g>
  <g transform="translate(720 175)"><rect width="300" height="135" rx="16" fill="#ffffff" stroke="#d1d5db"/><text x="25" y="40" fill="#4b5563" font-size="17" font-weight="700">SUPPORT TICKET RATE</text><text x="25" y="95" fill="#111827" font-size="42" font-weight="700">3.80%</text></g>
  <g transform="translate(1055 175)"><rect width="295" height="135" rx="16" fill="#ffffff" stroke="#d1d5db"/><text x="25" y="40" fill="#4b5563" font-size="17" font-weight="700">RETRY-ELIGIBLE FAILURES</text><text x="25" y="95" fill="#111827" font-size="42" font-weight="700">336</text></g>
  <text x="50" y="365" fill="#111827" font-size="24" font-weight="700">Key findings</text>
  <rect x="50" y="390" width="1300" height="160" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="80" y="430" fill="#111827" font-size="20">• Card is the lowest-performing method at 87.22% success.</text>
  <text x="80" y="468" fill="#111827" font-size="20">• India is the lowest-performing market at 86.79% success.</text>
  <text x="80" y="506" fill="#111827" font-size="20">• Issuer declines represent 22.25% of failed attempts.</text>
  <text x="50" y="610" fill="#111827" font-size="24" font-weight="700">Modeled recovery scenario</text>
  <rect x="50" y="635" width="620" height="125" rx="16" fill="#ffffff" stroke="#d1d5db"/>
  <text x="80" y="680" fill="#4b5563" font-size="17" font-weight="700">25% OF RETRY-ELIGIBLE FAILURES RECOVERED</text>
  <text x="80" y="728" fill="#111827" font-size="34" font-weight="700">+2.10 pp success rate · $5.94K GMV</text>
  <rect x="705" y="635" width="645" height="125" rx="16" fill="#111827"/>
  <text x="735" y="680" fill="#cbd5e1" font-size="17" font-weight="700">TOP PRIORITY</text>
  <text x="735" y="728" fill="#ffffff" font-size="31" font-weight="700">Smart retry + downtime-aware routing</text>
</g>
<text x="50" y="800" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="14">Scenario estimates are directional portfolio analysis, not observed production results.</text>
</svg>